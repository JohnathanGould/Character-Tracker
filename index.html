<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<meta name="description" content="Balthazar's characters: live Pathfinder trackers and sheets">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Character Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="daerlieth/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="daerlieth/icons/icon-180.png">
<script>
  /* old links to Daerlieth's tracker (the site root with ?view or ?edit) still open her tracker */
  (function () { var q = location.search; if (/[?&](view|edit)\b/.test(q)) location.replace("daerlieth/" + q + location.hash); })();
</script>
<title>Character Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Marcellus&display=swap">
<style>
:root {
  --bg: #05060a;
  --surface: #0c0f17;
  --surface-2: #141925;
  --line: #1d2333;
  --line-strong: #394460;
  --fg: #e9edf7;
  --muted: #8f99b5;
  --moon: #a9c1ff;
  --moon-ink: #060914;
  --good: #6fd6a4;
  --font-display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  background-image: radial-gradient(ellipse 900px 520px at 50% -120px, rgba(120, 150, 255, 0.10), transparent 70%);
  color: var(--fg);
  font-family: var(--font-body);
  line-height: 1.5;
  padding: env(safe-area-inset-top, 0px) 16px 48px;
}
.wrap { max-width: 860px; margin-inline: auto; }
header { padding: 40px 0 24px; display: flex; align-items: center; gap: 14px; }
header svg { width: 34px; height: 34px; flex: none; color: var(--moon); filter: drop-shadow(0 0 8px rgba(169, 193, 255, 0.45)); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; letter-spacing: 0.02em; margin: 0; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 0.85rem; }
.list { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .list { grid-template-columns: 1fr 1fr; } }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.card.empty { border-style: dashed; background: transparent; color: var(--muted); justify-content: center; min-height: 160px; }
.who { display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit; }
.who img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 1px solid var(--moon); box-shadow: 0 0 0 3px rgba(169, 193, 255, 0.08); flex: none; background: var(--surface-2); }
.who h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; margin: 0; line-height: 1.15; }
.who p { margin: 2px 0 0; color: var(--muted); font-size: 0.82rem; }
.pet { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.8rem; }
.pet img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line-strong); }
.game { margin: 0; font-size: 0.84rem; color: var(--muted); }
.game a { color: var(--moon); text-underline-offset: 2px; }
.noimg { width: 72px; height: 72px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; border: 1px dashed var(--line-strong); color: var(--muted); font-family: var(--font-display); font-size: 1.5rem; }
.soon { margin: 0; color: var(--muted); font-size: 0.82rem; font-style: italic; }
.live { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); min-height: 1.2em; margin: 0; }
.live b { color: var(--fg); font-weight: 500; }
.live .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 0 14px; border-radius: 9px;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--fg);
  font: inherit; font-size: 0.88rem; font-weight: 600; text-decoration: none; cursor: pointer;
}
.btn.primary { background: var(--moon); border-color: var(--moon); color: var(--moon-ink); }
.btn:focus-visible, .who:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
footer { margin-top: 28px; color: var(--muted); font-size: 0.78rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5l1.7 6.1 5.7-2.8-2.8 5.7 6.1 1.7-6.1 1.7 2.8 5.7-5.7-2.8L12 22.5l-1.7-6.1-5.7 2.8 2.8-5.7L1.3 12l6.1-1.7-2.8-5.7 5.7 2.8z"/></svg>
    <div>
      <h1>Character Tracker</h1>
      <p class="sub">Balthazar's characters, game by game. Each tracker updates live; anyone with the link can watch.</p>
    </div>
  </header>
  <main class="list" id="list" aria-label="Characters"></main>
  <footer>The GM view of a character is its link with <code>?view</code>. The player signs in on the character's own page.</footer>
</div>
<script>
(function () {
  /* one entry per character (a card without path/doc is one with no tracker yet: name and a "tracker coming" note;
     `full` then makes the portrait open the full picture): its folder, Firestore document id (trackers/{doc}) and the card text.
     A new tracker goes in its own folder next to daerlieth/, then gets a line here. */
  var CHARACTERS = [
    { path: "daerlieth/", doc: "daerlieth", name: "Daerlieth Nightstar", thumb: "daerlieth/images/daerlieth-thumb.webp",
      line: function (L) { return "Moon elf · Eternal Mage " + L + " // Spell-less Ranger " + L + " · Archmage 2"; },
      pet: { name: "Gwathfaron, panther", thumb: "daerlieth/images/gwathfaron-thumb.webp" },
      game: { name: "Cormanthyr", system: "Pathfinder 1e", url: "https://rpol.net/game.php?gi=80510&date=1792113654" } },
    { path: "courynna/", doc: "courynna", name: "Courynna Talaudrym", thumb: "courynna/images/courynna-thumb.webp",
      line: function () { return "Human · Factotum 5"; }, live: function (s) { return " · inspiration <b>" + s.ip + "</b>/4"; },
      game: { name: "Emerging", system: "D&D 3.5", url: "https://rpol.net/game.php?gi=80341&date=1792177427" } },
    { path: "nhym/", doc: "nhym", name: "Nhym Ashcloak", thumb: "nhym/images/nhym-thumb.webp",
      line: function () { return "Whisper gnome · Rogue 5 · Shadowdale"; }, live: function (s) { var n = 4 - Object.keys(s.sla || {}).length; return " · spell-like <b>" + n + "</b>/4"; },
      game: { name: "Forgotten Realms 3.5", system: "D&D 3.5", url: "https://rpol.net/game.php?gi=80363" } },
    { path: "skabs/", doc: "skabs", name: "Skabs", thumb: "skabs/images/skabs-thumb.webp",
      line: function () { return "Goblin · Paladin 4 · with Greg, his war pony"; }, live: function (s) { return " · luck <b>" + (s.luck || 0) + "</b>" + (s.torch && s.torch.on ? " · torch lit" : ""); },
      game: { name: "The Alright Company", system: "Shadowdark", url: "https://rpol.net/game.php?gi=78799&date=1792357554" } },
    { path: "tholgar/", doc: "tholgar", name: "Tholgar “Two-Tankards” Bloodshield", thumb: "tholgar/images/tholgar-thumb.webp",
      line: function () { return "Dwarf · Skald 2 // Slayer 2"; }, live: function (s) { return " · song <b>" + (s.song != null ? s.song : 7) + "</b>/7" + (s.songOn ? " · playing" : ""); },
      game: { name: "Midnight Gospel", system: "Pathfinder 1e", url: "https://rpol.net/game.php?gi=80406&date=1791684804" } }
  ];
  var PROJECT = "tracker-fe359";
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var ago = function (t) {
    var m = Math.round((Date.now() - t) / 60000);
    return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago";
  };
  var list = document.getElementById("list");
  var initials = function (n) { return n.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2); };
  list.innerHTML = CHARACTERS.map(function (c, i) {
    var face = c.thumb ? '<img src="' + c.thumb + '" alt="" width="72" height="72">' : '<span class="noimg" aria-hidden="true">' + esc(initials(c.name)) + "</span>";
    var who = face + '<div><h2>' + esc(c.name) + '</h2><p id="line' + i + '">' + esc(c.line(8)) + "</p></div>";
    return '<article class="card">' +
      (c.path ? '<a class="who" href="' + c.path + '">' + who + "</a>" : c.full ? '<a class="who" href="' + c.full + '" target="_blank" rel="noopener" title="Full portrait">' + who + "</a>" : '<div class="who">' + who + "</div>") +
      (c.game ? '<p class="game">' + (c.game.system ? esc(c.game.system) + " game: " : "Game: ") + (c.game.url ? '<a href="' + esc(c.game.url) + '" target="_blank" rel="noopener">' + esc(c.game.name) + ' on RPoL ↗</a>' : esc(c.game.name)) + "</p>" : "") +
      (c.pet ? '<div class="pet"><img src="' + c.pet.thumb + '" alt="" width="28" height="28">' + esc(c.pet.name) + "</div>" : "") +
      '<p class="live" id="live' + i + '"></p>' +
      (c.path ? '<div class="row"><a class="btn primary" href="' + c.path + '">Open tracker</a><a class="btn" href="' + c.path + '?view">GM view</a></div>' : '<p class="soon">Tracker not built yet.</p>') + "</article>";
  }).join("") + '<div class="card empty"><p>More characters to come. Each gets its own tracker and sheet here.</p></div>';

  /* live line from each character's public document: level, hit points, round, last change */
  CHARACTERS.forEach(function (c, i) {
    if (!c.doc) return;
    fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents/trackers/" + c.doc)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.fields || !d.fields.json) return;
        var s = JSON.parse(d.fields.json.stringValue), L = s.level || 8, up = d.fields.updatedAt;
        document.getElementById("line" + i).textContent = c.line(L);
        var t = up && (up.timestampValue ? Date.parse(up.timestampValue) : up.integerValue ? +up.integerValue : up.doubleValue ? +up.doubleValue : 0);
        document.getElementById("live" + i).innerHTML = '<span class="dot"></span>Round <b>' + (s.round || 1) + "</b> · HP <b>" + s.hp + "</b>" +
          (c.pet && s.petHp != null ? " · " + esc(c.pet.name.split(",")[0]) + " <b>" + s.petHp + "</b>" : "") + (c.live ? c.live(s) : "") + (t ? " · updated " + ago(t) : "");
      })
      .catch(function () { /* offline: the card works without the live line */ });
  });

  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
