<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Daerlieth Nightstar burnout ledger: live Pathfinder 1e tracker">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Daerlieth Burnout Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Marcellus&display=swap">
<style>
/* Layout: sticky round clock on top; three resource gauges; spell list beside a cast preview with the two concentration slots; stats, log and rulings below. Black ground, moon-silver accent, gold for mythic power, ember for burnout. One committed dark look. */
:root {
  --bg: #05060a;
  --surface: #0c0f17;
  --surface-2: #141925;
  --line: #1d2333;
  --line-strong: #394460;
  --fg: #e9edf7;
  --muted: #8f99b5;
  --moon: #a9c1ff;
  --moon-ink: #060914;
  --gold: #ebc676;
  --gold-fill: #d9a93f;
  --heat: #ff8f61;
  --heat-fill: #ec6a36;
  --good: #6fd6a4;
  --glow: rgba(120, 150, 255, 0.10);
  --hair: rgba(255, 255, 255, 0.05);
  --font-display: "Marcellus", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: "Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(ellipse 80% 420px at 50% -120px, var(--glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--fg);
  -webkit-font-smoothing: antialiased;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 16px;
  padding-block: 0 40px;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin-inline: auto; }

/* top bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: rgba(5, 6, 10, 0.88);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  margin-inline: -16px;
  padding: 10px 16px;
}
.top-in {
  max-width: 1120px;
  margin-inline: auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 20px;
}
.ident { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ident svg { width: 30px; height: 30px; flex: none; color: var(--moon); filter: drop-shadow(0 0 8px rgba(169, 193, 255, 0.45)); }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.55rem;
  line-height: 1.1;
  letter-spacing: 0.02em;
  margin: 0;
  text-wrap: balance;
}
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.8rem; }
.clock { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.round {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding-right: 6px;
}
.round .lbl, .lbl {
  font-size: 0.68rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.round b { font-family: var(--font-display); font-weight: 400; font-size: 1.7rem; line-height: 1; }

.btn {
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.88rem;
  transition: background 0.15s, border-color 0.15s, filter 0.15s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--moon); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #c3d4ff, var(--moon)); border-color: var(--moon); color: var(--moon-ink); box-shadow: 0 0 18px rgba(169, 193, 255, 0.22); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #d3e0ff, #b6caff); filter: none; }
.btn.warn { border-color: var(--heat); color: var(--heat); }
.btn.warn:hover:not(:disabled) { border-color: var(--heat); background: rgba(236, 106, 54, 0.12); }
.btn.sm { min-height: 34px; padding: 0 10px; font-size: 0.82rem; }
.btn.icon { width: 40px; padding: 0; font-family: var(--font-mono); font-size: 1.05rem; }
.tray-wrap { max-width: 1120px; margin-inline: auto; }
.tray { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 10px; }
.tray .lbl { margin-right: 4px; }
.tray .field { flex: 1 1 150px; max-width: 230px; }
.tray .warn-text { flex-basis: 100%; margin: 0; }

/* view-only mode for anyone who cannot write */
.ro .clock .btn, .ro .tray-wrap, .ro .castbox .opts, .ro .castbox .fields, .ro .castbox [data-act="cast"], .ro .castbox .warn-text,
.ro [data-act="str"], .ro [data-act="resolve"], .ro [data-act="endspell"], .ro [data-act="clearlog"],
.ro [data-act="burn"], .ro [data-act="res"], .ro .passrow, .ro [data-act="hp"], .ro [data-act="mspend"] { display: none !important; }
.ro .toggle, .ro .spell, .ro .cell, .ro .pip { pointer-events: none; }
.ro .cols { grid-template-columns: 1fr; }
.lv {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 78px;
  min-height: 52px;
  padding: 6px 10px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer;
}
.lv:hover { background: var(--surface-2); }
.lv b { font-weight: 600; font-size: 0.9rem; }
.lv span { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.lv span.cost { color: var(--heat); }

main { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; }
.panel {
  background: linear-gradient(180deg, #0f131d, var(--surface) 140px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  min-width: 0;
  box-shadow: inset 0 1px 0 var(--hair), 0 14px 32px rgba(0, 0, 0, 0.45);
}
.panel h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.15rem;
  line-height: 1.2;
  letter-spacing: 0.02em;
}
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 0.8rem; margin: 0; }

/* resources */
.gauges { display: grid; gap: 0; grid-template-columns: 1fr; }
.gsec { min-width: 0; padding: 14px 0; }
.gsec:first-child { padding-top: 0; }
.gsec:last-child { padding-bottom: 0; }
.gsec + .gsec { border-top: 1px solid var(--line); }
.gsec .gh { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.gsec h2 { font-size: 1rem; }
.gsec .big { margin-bottom: 8px; gap: 10px; }
.gsec .bignum { font-size: 2.4rem; }
.gsec .ctl { margin-top: 10px; }
.helpbtn { min-height: 28px; padding: 0 10px; font-size: 0.78rem; }
@media (max-width: 859px) {
  .gauges { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  #pBurn { grid-column: 1 / -1; }
  #pMyth { border-left: 1px solid var(--line); padding-left: 14px; }
  #pOver { padding-right: 14px; }
  #pOver, #pMyth { padding-bottom: 0; }
  .gsec .gh { flex-wrap: wrap; gap: 2px 8px; }
  #pOver .pips:has(.pip.od) { grid-template-columns: repeat(5, 20px); gap: 7px; }
  #pOver .pip, #pMyth .pip { width: 20px; height: 20px; }
  #pMyth .pips { gap: 6px; }
}
@media (min-width: 860px) {
  .gauges { grid-template-columns: 1.5fr 1fr 1fr; }
  .gsec { padding: 0 18px; }
  .gsec:first-child { padding-left: 0; }
  .gsec:last-child { padding-right: 0; }
  .gsec + .gsec { border-top: 0; border-left: 1px solid var(--line); }
}
.helpform { max-width: 560px !important; }
.duo { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); align-items: stretch; }
.group.pickbox { min-width: 0; margin-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
.pickbox .field select { width: 100%; }
.spells.one { grid-template-columns: 1fr; }
/* equal-height columns: each cast block fills its column and the Cast button sits at the bottom, so all three line up */
.castbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface-2); min-width: 0; flex: 1; display: flex; flex-direction: column; }
.castbox > [data-act="cast"] { margin-top: auto; }
.castbox .ph { margin-bottom: 8px; }
.castbox .cast-name { font-size: 1.05rem; }
.castbox .btn.primary { width: 100%; }
.brief { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.brief .rows { margin: 0 0 8px; font-size: 0.8rem; gap: 2px 10px; }
.brief .rows dt { font-size: 0.74rem; }
.brieftext { margin: 0 0 8px; font-size: 0.84rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.passrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.passrow .hint { flex-basis: 100%; }
.sinfo { flex: none; }
.sinfo.mini { min-height: 22px; width: 22px; padding: 0; margin-right: 6px; border-radius: 50%; font-family: var(--font-mono); font-size: 0.72rem; vertical-align: 1px; }
.scard-rows { margin-top: 0; }
.scard-text { font-size: 0.88rem; line-height: 1.5; }
.scard-text p { margin: 0 0 8px; }
.scard-text h3 { font-family: var(--font-display); font-weight: 400; font-size: 1rem; margin: 10px 0 6px; color: var(--moon); }
.helpform a { color: var(--moon); }
.helpform ul.letter { margin: 0; padding-left: 18px; font-size: 0.9rem; line-height: 1.5; }
.helpform ul.letter li { margin-bottom: 6px; }
.helpform .explain { margin-top: 0; padding-top: 0; border-top: 0; }
.big { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
.bignum { font-family: var(--font-display); font-size: 3.2rem; line-height: 1; min-width: 2ch; }
.bignum small { font-size: 1.1rem; color: var(--muted); font-family: var(--font-mono); }
.effects { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  padding: 3px 8px;
  border: 1px solid rgba(169, 193, 255, 0.45);
  border-radius: 999px;
  background: rgba(169, 193, 255, 0.16);
  color: var(--moon);
  white-space: nowrap;
}
.chip.hot { border-color: var(--heat); color: var(--heat); background: rgba(236, 106, 54, 0.14); }
.chip.on { border-color: var(--moon); color: var(--moon-ink); background: var(--moon); }
.track { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.cell {
  height: 30px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  padding: 0;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--muted);
}
.cell.on { background: var(--heat-fill); border-color: var(--heat-fill); color: #1a0a03; font-weight: 600; box-shadow: 0 0 10px rgba(236, 106, 54, 0.4); }
.tiers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 4px; }
.tiers span {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  text-align: center;
  color: var(--muted);
  border-top: 2px solid var(--line);
  padding-top: 2px;
}
.tiers span.on { color: var(--heat); border-top-color: var(--heat-fill); }
.over { font-family: var(--font-mono); font-size: 0.78rem; color: var(--heat); margin-top: 6px; }
.ctl { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.explain { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 0.86rem; display: flex; flex-direction: column; gap: 8px; }
.explain p { margin: 0; max-width: 62ch; }
.explain b { font-weight: 600; }
.costs { display: flex; flex-wrap: wrap; gap: 6px; }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pips:has(.pip.od) { display: grid; grid-template-columns: repeat(5, 24px); gap: 8px 10px; }
.pip {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  background: transparent;
  cursor: pointer;
  padding: 0;
}
.pip.od.on { background: var(--moon); border-color: var(--moon); box-shadow: 0 0 8px rgba(169, 193, 255, 0.5); }
.pip.my.on { background: var(--moon); border-color: var(--moon); box-shadow: 0 0 8px rgba(169, 193, 255, 0.5); }

/* spells + cast */
.cols { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 860px) { .cols { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.group { margin-bottom: 14px; }
.group:last-child { margin-bottom: 0; }
.group h3 {
  margin: 0 0 6px;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.spells { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.spell {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 42px;
  padding: 6px 10px;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer;
  min-width: 0;
}
.spell:hover { background: var(--surface-2); }
.spell[aria-pressed="true"] { border-color: var(--moon); background: rgba(169, 193, 255, 0.08); box-shadow: inset 0 0 0 1px var(--moon); }
.spell .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 500; font-size: 0.9rem; }
.spell .bg { flex: none; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.spell .bg.cost { color: var(--heat); }
.spell .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }

.opts { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
.opt { display: flex; align-items: flex-start; gap: 10px; font-size: 0.88rem; }
.opt input[type="checkbox"] { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--moon); flex: none; }
.opt small { display: block; color: var(--muted); font-size: 0.78rem; }
.opt.dis { opacity: 0.5; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--muted); }
.field select, .field input[type="text"] {
  min-height: 38px;
  padding: 0 8px;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  color: var(--fg);
}
.fields { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.fields .field { flex: 1 1 140px; min-width: 0; }

.cast-name { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.15; margin: 0; }
.cast-lvl { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.rows { margin: 10px 0 12px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 0.9rem; }
.rows dt { color: var(--muted); font-size: 0.8rem; padding-top: 1px; }
.rows dd { margin: 0; overflow-wrap: anywhere; }
.rows dd.gain { color: var(--heat); font-weight: 600; }
.rows dd.zero { color: var(--good); font-weight: 600; }
.spend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.warn-text { color: var(--heat); font-size: 0.82rem; margin: 0 0 10px; }

/* slots */
.slots { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 520px) { .slots { grid-template-columns: 1fr 1fr; } }
.slot { border: 1px dashed var(--line-strong); border-radius: 8px; padding: 10px 12px; min-width: 0; min-height: 92px; display: flex; flex-direction: column; gap: 6px; }
.slot.full { border-style: solid; border-color: var(--line); background: var(--surface-2); }
.slot .nm { font-weight: 600; overflow-wrap: anywhere; }
.slot .left { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #7f9fe8, var(--moon)); }
.slot .empty { color: var(--muted); font-size: 0.85rem; }
.pending { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.pend { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; flex-wrap: wrap; }
.pend.due { border-color: var(--heat); }
.pend .t { min-width: 0; overflow-wrap: anywhere; font-size: 0.88rem; }
.pend .t b { display: block; }
.pend.due .t b { color: var(--heat); }

/* stats */
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-bottom: 14px; }
.stat { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.stat .v { font-family: var(--font-display); font-size: 1.45rem; line-height: 1.15; }
.stat .s { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.conds { display: flex; flex-wrap: wrap; gap: 8px; }
.hpgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.hpb { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 12px; min-width: 0; }
.hpb .lbl { margin-bottom: 6px; }
.toggle {
  min-height: 40px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 500;
  text-align: left;
}
.toggle:disabled { opacity: 0.45; cursor: not-allowed; }
.toggle[aria-pressed="true"] { border-color: var(--moon); background: rgba(169, 193, 255, 0.08); box-shadow: inset 0 0 0 1px var(--moon); color: var(--moon); }

/* log + rules */
.lower { display: grid; gap: 16px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 860px) { .lower { grid-template-columns: 1fr 1fr; } }
.log { list-style: none; margin: 0; padding: 0; max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.log li { display: flex; gap: 10px; font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.log .r { font-family: var(--font-mono); color: var(--muted); flex: none; min-width: 3.2ch; }
.log .tx { min-width: 0; overflow-wrap: anywhere; }
.log-empty { color: var(--muted); font-size: 0.88rem; margin: 0; }
details { border-top: 1px solid var(--line); padding: 10px 0; }
details:first-of-type { border-top: 0; padding-top: 0; }
summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }
details ul { margin: 8px 0 0; padding-left: 1.1em; font-size: 0.86rem; color: var(--fg); display: flex; flex-direction: column; gap: 4px; }
.status { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }

/* account: sign-in link, sign-in sheet */
.acct { background: none; border: 0; padding: 0; margin-left: 6px; color: var(--moon); font-family: var(--font-mono); font-size: 0.72rem; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, 0.7); }
.sheet form { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; padding: 20px; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.25rem; margin: 0; }
.sheet label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.sheet input { background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 9px 10px; color: var(--fg); }
.sheet .row { display: flex; gap: 10px; justify-content: flex-end; }
.sheet .err { color: var(--heat); font-size: 0.85rem; margin: 0; min-height: 1.2em; }

@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width 0.25s ease; }
  .cell, .pip, .spell, .toggle { transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; }
}

<div class="top">
  <div class="top-in">
    <div class="ident">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1 L13.76 7.75 L19.78 4.22 L16.25 10.24 L23 12 L16.25 13.76 L19.78 19.78 L13.76 16.25 L12 23 L10.24 16.25 L4.22 19.78 L7.75 13.76 L1 12 L7.75 10.24 L4.22 4.22 L10.24 7.75 Z"/></svg>

<div class="wrap">
<main>
  <section class="panel gauges" aria-label="Resources">

    <div class="gsec" id="pOver"></div>
    <div class="gsec" id="pMyth"></div>
  </section>

  <section class="panel" id="pSpells"></section>

  <section class="panel" id="pSlots"></section>

  <section class="panel" id="pBody"></section>
</main>

<div class="sheet" id="signin" hidden>
  <form id="signinForm" autocomplete="on">
    <h2>Sign in to edit</h2>
    <label id="siEmailRow">Email<input id="siEmail" type="email" autocomplete="username" required></label>
    <p class="sub" id="siAs" hidden>Signing in as <span id="siAsEmail"></span> · <button type="button" class="acct" id="siOther">use another email</button></p>
    <label>Password<input id="siPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="siErr" aria-live="polite"></p>
    <div class="row"><button type="button" class="acct" id="siForgot" style="margin-right:auto">Forgot password?</button><button type="button" class="btn" id="siCancel">Cancel</button><button type="submit" class="btn primary" id="siGo">Sign in</button></div>
  </form>
</div>

<div class="sheet" id="rsSheet" hidden>
  <form id="rsForm" autocomplete="on">
    <h2>Set a new password</h2>
    <input type="text" id="rsUser" autocomplete="username" hidden>
    <p class="sub" id="rsFor"></p>
    <label>New password<input id="rsNew" type="password" autocomplete="new-password" minlength="6" required></label>
    <label>New password again<input id="rsNew2" type="password" autocomplete="new-password" minlength="6" required></label>
    <p class="err" id="rsErr" aria-live="polite"></p>
    <div class="row"><button type="button" class="btn" id="rsCancel">Cancel</button><button type="submit" class="btn primary" id="rsGo">Save password</button></div>
  </form>
</div>

<div class="sheet" id="lvlSheet" hidden>
  <form id="lvlForm" class="lvform">
    <h2 id="lvlTitle">Level up</h2>
    <div id="lvlBody"></div>
    <div class="lvroll">
      <label class="field">Hit points rolled on RPoL (d10)<input id="lvlRoll" type="text" inputmode="numeric" maxlength="2" placeholder="1–10"></label>
    </div>
    <p class="err" id="lvlErr" aria-live="polite"></p>
    <div class="row"><button type="button" class="btn" id="lvlCancel">Cancel</button><button type="submit" class="btn primary" id="lvlGo">Level up</button></div>
  </form>
</div>

<datalist id="codexList"></datalist><div id="wizLists" hidden></div>
<div class="sheet" id="helpSheet" hidden>
  <form class="helpform" id="helpForm">
    <h2 id="helpTitle">How burnout works</h2>
    <div id="helpBody"></div>
    <div class="row"><button type="submit" class="btn primary">Close</button></div>
  </form>
</div>

<div class="sheet" id="pwSheet" hidden>
  <form id="pwForm" autocomplete="on">

    <div class="row"><button type="button" class="btn" id="pwCancel">Cancel</button><button type="submit" class="btn primary" id="pwGo">Change</button></div>
  </form>
</div>

    var fireNote = fire ? " (fire +2 from Elemental Bond)" : "";

    rows.push(["Caster level", cl + fireNote + (wa ? ", Wild Arcana +2" : "")]);
    if (sp.save || (sp.art && ui.mode === "burst")) rows.push(["Save DC", (sp.save || "Reflex") + " " + dc]);

    switch (sp.calc) {
      case "art": {
        var n = Math.max(0, 6 - Math.floor(s.burnout / 2)), f = d8 ? 8 : 6;
        rows.push(["Damage", n + "d" + f + "+" + dv().sp.artFlat + " arcane, avg " + avg(n, f, dv().sp.artFlat) + (d8 ? " (artillery overdrive d8)" : "")]);
        if (ui.mode === "std") rows.push(["Delivery", "Ranged touch +" + dv().rtouch + ", 30 ft, standard action"]);
        if (ui.mode === "sniper") rows.push(["Delivery", "Ranged touch +" + dv().rtouch + ", 120 ft (Artillery Sniper)"]);
        if (ui.mode === "burst") rows.push(["Delivery", "15 ft burst around her, Reflex half. She takes no damage (Artillery Burst)"]);
        break;
      }
      case "fb": {
        var nf = Math.min(10, cl);
        if (myth) {
          rows.push(["Damage", nf + "d10 fire, avg " + avg(nf, 10, 0) + ", 20 ft burst, Reflex half (mythic)"]);
          rows.push(["Burning", "A creature that fails its save catches fire: 2d6 fire each round until put out (save DC " + dc + " to extinguish)"]);
        } else rows.push(["Damage", nf + "d6 fire, avg " + avg(nf, 6, 0) + ", 20 ft burst, Reflex half"]);
        break;
      }
      case "det": {
        var nd = Math.min(10, cl);
        rows.push(["Damage", nd + "d8 " + ui.element + " in 15 ft, avg " + avg(nd, 8, 0) + "; half from 15 to 30 ft (max 10d8)"]);
        rows.push(["Timing", "Goes off 1 round after casting. She takes half with no save; resist energy can cancel it"]);
        if (s.blood) {
          rows.push(["Material", "Blood Money is paying the 50 gp this round. No vials spent"]);
        } else {
          rows.push(["Material", "1 vial pair (50 gp). " + s.vials + " cast" + (s.vials === 1 ? "" : "s") + " in the haversack"]);
          if (s.vials < 1) problems.push("No detonate vials left. Pay with Blood Money or buy more.");
        }
        break;
      }
      case "bm": {
        var gp = ui.bmChoice === "det" ? 50 : ui.bmChoice === "cheap" ? 1 : Math.max(0, Math.floor(+ui.bmGp || 0));
        bmName = ui.bmChoice === "det" ? "Detonate" : ui.bmChoice === "cheap" ? "a cheap component" : "a " + gp + " gp component";
        bmStr = gp > 1 ? 1 + Math.floor(gp / 500) : 0;
        rows.push(["Cost", "1d6 damage to her" + (bmStr ? " and " + bmStr + " Strength damage" : ", no Strength damage")]);
        rows.push(["Effect", "Her blood becomes one material component of the next spell she casts this round (" + bmName + ", " + gp + " gp)"]);
        rows.push(["Action", "Swift action. It does not end the round, and it can be paired with Wild Arcana (a standard action)"]);
        if (s.blood) problems.push("Blood Money is already active this round.");
        break;
      }
      case "mm": {
        var mm = Math.min(5, 1 + Math.floor((cl - 1) / 2));
        rows.push(["Damage", mm + " missiles, 1d4+1 force each, avg " + avg(mm, 4, mm) + ", no attack roll"]);
        break;
      }
      case "sr": {
        var rays = cl >= 11 ? 3 : cl >= 7 ? 2 : 1;
        rows.push(["Damage", rays + " ray" + (rays > 1 ? "s" : "") + ", 4d6 fire each, avg " + avg(4 * rays, 6, 0) + " total, ranged touch +" + dv().rtouch]);
        break;
      }
      case "dm": {
        rows.push(["Dispel check", "1d20 + " + Math.min(cl, 10) + ", rolled twice, take the higher (Eldritch Breach)"]);
        break;
      }
      case "re": {
        rows.push(["Resistance", (cl >= 11 ? 30 : cl >= 7 ? 20 : 10) + " to one energy type"]);
        break;
      }
      case "dd": {
        if (myth) {
          rows.push(["Range", (400 + 40 * cl) + " ft"]);
          rows.push(["Portal", "She goes through at once and brings no one. An invisible one-way portal stays in her square for " + Math.max(1, Math.floor(cl / 2)) + " round" + (Math.floor(cl / 2) > 1 ? "s" : "") + "; up to " + cl + " creatures she picks can step through (not an action), then can't act until their next turn"]);
        } else {
          var pass = Math.floor(cl / 3);
          rows.push(["Range", (400 + 40 * cl) + " ft, her and " + (pass ? "up to " + pass + " willing Medium or smaller creature" + (pass > 1 ? "s" : "") : "no one else")]);
        }
        break;
      }
    }
    if (sp.sch && sp.sch !== "?") rows.push(["School", SCHOOLS[sp.sch] + (FOCUS[sp.sch] ? ", a focus school" : sp.exp ? ", outside her focus schools (fine for an experimental spell, which can come from any school)" : ", outside her focus schools")]);
    if (sp.unk) rows.push(["Check", "School, duration and casting time are not recorded. Read the spell." + (sp.custom ? " Wild Arcana needs a casting time of 1 standard action or less." : "")]);
    if (sp.custom && sp.slow) problems.push("Casting time is longer than 1 standard action, so Wild Arcana cannot cast it.");
    if (sp.note && !sp.calc) rows.push(["Effect", sp.note]);
    else if (sp.note && (sp.calc === "re" || sp.calc === "dd")) { /* calc covers it */ }

    var dur = 0;
    if (sp.per) {
      dur = sp.fixed ? sp.fixed : sp.per < 0 ? -1 : cl * sp.per;
      rows.push(["Duration", sp.dtext ? (sp.dtext + (dur > 0 ? " = " + fmtDur(dur) : "") + ", uses a concentration slot") : (sp.fixed ? "1 round, then instantaneous" : dur < 0 ? "While she concentrates" : fmtDur(dur)) + ", uses a concentration slot until it goes off"]);
    }

    var mythCost = (wa ? 1 : 0) + (myth ? 1 : 0);
    if (s.mythic < mythCost) problems.push(mythCost > 1 ? "Wild Arcana and the mythic version need 2 mythic power; she has " + s.mythic + "." : wa ? "No mythic power left for Wild Arcana." : "No mythic power left for the mythic version.");

    return { cl: cl, dc: dc, gain: gain, burn: burn, od: od, d8: d8, blood: !!(sp.calc === "det" && s.blood), bmStr: bmStr, bmName: bmName, odCost: (od ? 1 : 0) + (d8 ? 1 : 0), wa: wa, myth: myth, mythCost: mythCost, odUseful: odUseful, dur: dur,
      rows: rows, problems: problems, fire: fire };
  }

  /* ---------- state changes ---------- */
  function log(text) {
    state.log.unshift({ r: state.round, t: text });
    state.log = state.log.slice(0, 40);
  }
  function mutate(fn) {
    if (readOnly) return;
    fn(state);
    state.overdrive = Math.min(odMax(), state.overdrive);
    render();
    scheduleSave();
  }

  function castBlood(c) {
    mutate(function (s) {
      s.strDmg = Math.min(16, s.strDmg + c.bmStr);
      s.blood = { name: c.bmName };
      log("Cast Blood Money for " + c.bmName + ": 1d6 damage" + (c.bmStr ? ", Strength damage +" + c.bmStr : ", no Strength damage"));
    });
    ui.od = false; ui.d8 = false; ui.wa = false; ui.myth = false; ui.castOn = "her";
    render();
  }

  function doCast() {
    var sp = getSpell(ui.sel);
    if (!sp) return;
    var c = compute(sp);
    if (c.problems.length) return;
    if (sp.calc === "bm") { castBlood(c); return; }
    var nm = sp.custom ? sp.name : sp.name;
    mutate(function (s) {
      if (c.odCost) s.overdrive = Math.max(0, s.overdrive - c.odCost);
      if (c.mythCost) s.mythic = Math.max(0, s.mythic - c.mythCost);
      if (sp.calc === "det" && !c.blood) s.vials = Math.max(0, s.vials - 1);
      if (c.burn > 0) { s.burnout += c.burn; s.gained = true; }
      var bits = [];
      bits.push(c.burn > 0 ? "+" + c.burn + " burnout" : "no burnout");
      if (c.odCost) bits.push("overdrive −" + c.odCost);
      if (c.mythCost) bits.push("mythic −" + c.mythCost + (c.myth ? " (mythic " + sp.name.toLowerCase() + ")" : ""));
      if (c.blood) bits.push("paid with Blood Money");
      else if (sp.calc === "det") bits.push("vials −1");
      bits.push("CL " + c.cl);
      if (sp.art) bits.push(ui.mode === "burst" ? "burst" : ui.mode === "sniper" ? "sniper" : "touch");
      if (sp.calc === "det") bits.push(ui.element);

      if (c.dur !== 0) {
        var aid = sp.aid || sp.id;
        s.active = s.active.filter(function (a) { return a.id !== aid; });
        if (s.active.length >= LP().slots) {
          var gone = s.active.shift();
          log(gone.name + " ended: a third spell needs a slot");
        }
        var on = ui.castOn === "pet" || ui.castOn === "ally" ? ui.castOn : "her";
        s.active.push({ id: aid, name: nm, cast: s.round, end: c.dur > 0 ? s.round + c.dur : null, total: c.dur > 0 ? c.dur : 0, on: on });
        if (on !== "her") bits.push(on === "pet" ? "on Gwathfaron" : "on an ally");
      }
      if (sp.calc === "det") {
        s.pending.push({ id: "p" + Date.now(), name: "Detonate (" + ui.element + ")", fire: s.round + 1, text: Math.min(10, c.cl) + "d8, Reflex DC " + c.dc });
      }
      log("Cast " + nm + ": " + bits.join(", "));
      passRound(s, c.burn > 0);
    });
    ui.od = false;
    ui.d8 = false;
    ui.wa = false; ui.myth = false; ui.castOn = "her";
    ui.blood = false;
    render();
  }

  /* status effects on her and Gwathfaron count down one round at a time */
  function tickFx(s, n) {
    ["her", "pet"].forEach(function (who) {
      s.fx[who] = s.fx[who].filter(function (e) {
        if (e.left == null) return true;
        e.left -= n || 1;
        if (e.left <= 0) { log(e.name + " on " + (who === "pet" ? "Gwathfaron" : "Daerlieth") + " ended"); return false; }
        return true;
      });
    });
  }

  function passRound(s, gainedBurn) {
    s.round += 1;
    tickFx(s);
    if (!gainedBurn && s.burnout > 0) {
      s.burnout -= 1;
      log("Recovered 1 burnout: none gained");
    }
    s.gained = false;
    s.blood = null;
    s.active = s.active.filter(function (a) {
      if (a.end !== null && a.end <= s.round) { log(a.name + " expired"); return false; }
      return true;
    });
  }

  function trayCast(value) {
    var parts = value.split("|");
    var sp = getSpell(parts[0]);
    if (!sp) return;
    ui.sel = sp.id;
    if (!/^(exp-|custom)/.test(sp.id)) ui.knownSel = sp.id;
    ui.od = ui.qOd; ui.d8 = false; ui.wa = false; ui.myth = false; ui.castOn = "her";
    if (sp.calc === "det" && parts[1]) ui.element = parts[1];
    if (sp.art && parts[1]) ui.mode = parts[1];
    var gp = sp.cost || 0;
    var pay = gp > 1 && ui.qBlood && !state.blood;
    var prevBlood = state.blood;
    if (pay) state.blood = { name: sp.name };
    var c = compute(sp);
    if (pay) state.blood = prevBlood;
    if (c.problems.length) {
      ui.trayMsg = c.problems.join(" ");
      render();
      return;
    }
    ui.trayMsg = "";
    if (pay) {
      castBlood({ bmStr: 1 + Math.floor(gp / 500), bmName: sp.name });
      ui.od = ui.qOd;
    }
    doCast();
    ui.tray = false; ui.qOd = false;
    render();
  }

  function resetRound() {
    mutate(function (s) {
      s.round = 1;
      s.gained = false;
      s.active = []; s.pending = [];
      log("Round counter reset to 1, concentration cleared");
    });
  }

  function newDay() {
    mutate(function (s) {
      s.round = 1; s.gained = false; s.blood = null;
      s.burnout = 0; s.overdrive = odMax(); s.mythic = 7;
      s.lightUsed = false; s.active = []; s.pending = []; s.stun = LP().stunUses;
      var healed = s.strDmg > 0;
      if (healed) s.strDmg -= 1;
      /* natural healing after 8 hours of rest: 1 hp per level, the panther 1 per Hit Die */
      var lv = s.level, hdP = Levels.prog(lv).pet.hd;
      s.hp = Math.min(hpMax(), s.hp + lv); s.petHp = Math.min(petMax(), s.petHp + hdP);
      log("New day: overdrive " + s.overdrive + ", mythic power 7, burnout 0, Stunning Fist " + s.stun + ", hp +" + lv + " (panther +" + hdP + ")" + (healed ? ", Strength damage −1" : ""));
    });
    ui.tray = false;
    render();
  }

  /* out of combat: let minutes or hours go by. Every round in them gains no burnout, so each recovers 1 */
  function passTime(n) {
    mutate(function (s) {
      var before = s.burnout;
      s.round += n;
      tickFx(s, n);
      s.burnout = Math.max(0, s.burnout - n);
      log("Passed " + SheetEngine.fxLeft(n) + (before ? ": burnout " + before + " → " + s.burnout : ""));
      s.gained = false;
      s.blood = null;
      s.active = s.active.filter(function (a) {
        if (a.end !== null && a.end <= s.round) { log(a.name + " expired"); return false; }
        return true;
      });
    });
  }
  function noCast() {
    mutate(function (s) {
      var before = s.burnout;
      s.round += 1;
      tickFx(s);
      if (before > 0) { s.burnout -= 1; log("No cast: burnout " + before + " → " + s.burnout); }
      else log("No cast: no burnout to recover");
      s.gained = false;
      s.blood = null;
      s.active = s.active.filter(function (a) {
        if (a.end !== null && a.end <= s.round) { log(a.name + " expired"); return false; }
        return true;
      });
    });
  }

  /* ---------- rendering ---------- */
  function pips(kind, val, max) {
    var h = "";
    for (var i = 1; i <= max; i++) {
      h += '<button class="pip ' + (kind === "overdrive" ? "od" : "my") + (i <= val ? " on" : "") +
        '" data-act="setres" data-k="' + kind + '" data-n="' + i + '" aria-label="Set ' + kind + ' to ' + i + '"></button>';
    }
    return '<div class="pips">' + h + "</div>";
  }

  function renderBurn() {
    var b = state.burnout, h = "";
    for (var i = 1; i <= 12; i++) {
      h += '<button class="cell' + (i <= b ? " on" : "") + '" data-act="setburn" data-n="' + i + '" aria-label="Set burnout to ' + i + '">' + i + "</button>";
    }
    var t = "";
    for (var j = 1; j <= 6; j++) t += "<span" + (b >= j * 2 ? ' class="on"' : "") + ">−" + j + " DC</span>";
    var dcPen = Math.floor(b / 2);
    $("pBurn").innerHTML =
      '<div class="gh"><h2>Eldritch burnout</h2><button type="button" class="btn sm helpbtn" data-help="burn" aria-haspopup="dialog">How it works</button></div>' +
      '<div class="big"><div class="bignum num">' + b + '</div><div class="effects">' +
      '<span class="chip' + (b ? " hot" : "") + '">CL ' + (state.level - b) + "</span>" +
      '<span class="chip' + (dcPen ? " hot" : "") + '">DC −' + dcPen + "</span>" +
      '<span class="chip' + (dcPen ? " hot" : "") + '">Artillery ' + Math.max(0, LP().artDice - dcPen) + "d6</span>" +
      "</div></div>" +
      '<div class="track">' + h + '</div><div class="tiers">' + t + "</div>" +
      (b > 12 ? '<div class="over">Past the track: ' + b + "</div>" : "") +
      '<div class="ctl"><button class="btn icon" data-act="burn" data-d="-1" aria-label="Burnout minus one">−</button>' +
      '<button class="btn icon" data-act="burn" data-d="1" aria-label="Burnout plus one">+</button>' +
      '<button class="btn" data-act="burn" data-d="clear">Clear</button></div>';
  }
  function burnHelpHtml() {
    return '<div class="explain">' +
      "<p><b>What it is.</b> Daerlieth has no spell slots. Burnout is the only limit on how much she casts, and it builds up as she does.</p>" +
      "<p><b>When it goes up.</b> Each time she casts a spell of 1st level or higher. Press Cast spell in the top bar and choose a spell under its level, or cast one from the list. Either way the round advances. The + and − buttons are only for fixing a mistake.</p>" +
      '<div class="costs">' +
      '<span class="chip">Orisons: 0</span><span class="chip">1st and 2nd level: 0</span><span class="chip hot">3rd level: +1</span><span class="chip hot">4th level: +2</span><span class="chip hot">Experimental spell: +1 extra</span></div>' +
      "<p>Arcane artillery is treated as a spell of half her level, so 4th level (+2). Haste as the experimental spell is 3rd level plus 1, so +2. Spending 1 overdrive on a cast ignores up to 4 burnout from it.</p>" +
      "<p><b>When it goes down.</b> At the end of any round where she gained no burnout, she recovers 1. Press No cast to pass a round without casting. A cast that adds no burnout, such as an orison or a 1st or 2nd level spell, also lets her recover 1.</p>" +
      "<p><b>What it does while it is up.</b> Each point lowers her caster level by 1, which shortens durations and cuts dice such as fireball's. Every 2 points also lower spell DCs by 1 and artillery damage by 1d6. The burnout bar marks each step.</p>" +
      "</div>";
  }

  function renderOver() {
    $("pOver").innerHTML =
      '<div class="gh"><h2>Arcane overdrive</h2><span class="hint">Refills on New day</span></div>' +
      '<div class="big"><div class="bignum num">' + state.overdrive + '<small>/' + odMax() + '</small></div></div>' +
      pips("overdrive", state.overdrive, odMax()) +
      '<div class="ctl"><button class="btn icon" data-act="res" data-k="overdrive" data-d="-1" aria-label="Overdrive minus one">−</button>' +
      '<button class="btn icon" data-act="res" data-k="overdrive" data-d="1" aria-label="Overdrive plus one">+</button></div>';
  }

  function renderMyth() {
    $("pMyth").innerHTML =
      '<div class="gh"><h2>Mythic power</h2><span class="hint">Wild Arcana costs 1</span></div>' +
      '<div class="big"><div class="bignum num">' + state.mythic + '<small>/7</small></div></div>' +
      pips("mythic", state.mythic, 7) +
      '<div class="ctl"><button class="btn icon" data-act="res" data-k="mythic" data-d="-1" aria-label="Mythic power minus one">−</button>' +
      '<button class="btn icon" data-act="res" data-k="mythic" data-d="1" aria-label="Mythic power plus one">+</button>' +
      '<button class="btn sm" data-act="mspend" data-what="surge"' + (state.mythic < 1 ? " disabled" : "") + ' title="Immediate action, after seeing the roll: add 1d6 to a d20 roll she just made">Surge +1d6</button>' +
      '<button class="btn sm" data-act="mspend" data-what="init"' + (state.mythic < 1 ? " disabled" : "") + ' title="Amazing Initiative: free action on her turn, once per round. An extra standard action that cannot cast a spell or use artillery">Extra action</button></div>';
  }

  function spellBtn(sp) {
    var g = baseGain(sp);
    var badge = sp.lvl === 0 ? "free" : g > 0 ? "+" + g : "0";
    var cls = g > 0 ? "bg cost" : "bg";
    return '<button class="spell" data-act="pick" data-id="' + sp.id + '" aria-pressed="' + (ui.sel === sp.id) + '">' +
      '<span class="nm">' + (isActive(sp.id) ? '<span class="live" title="Active"></span>' : "") + esc(sp.name) + "</span>" +
      '<span class="' + cls + '">' + badge + "</span></button>";
  }

  function renderSpells() {
    /* known spells: one picker like the experimental and Wild Arcana ones, grouped by level */
    var mine = SPELLS.concat(knownSpells()), kOpts = "";
    if (!mine.some(function (x) { return x.id === ui.knownSel; })) ui.knownSel = "fireball";
    for (var L = 0; L <= Math.max(4, LP().maxSpell); L++) {
      var items = mine.filter(function (s) { return s.lvl === L && !s.art; });
      if (L === 4) items = items.concat(SPELLS.filter(function (s) { return s.art; }));
      if (!items.length) continue;
      kOpts += '<optgroup label="' + (L ? ordinal(L) + " level" : "Orisons, no burnout") + '">' + items.map(function (x) {
        var g = baseGain(x);
        return '<option value="' + x.id + '"' + (x.id === ui.knownSel ? " selected" : "") + ">" + esc(x.name) + (x.lvl === 0 ? "" : " (" + (g > 0 ? "+" + g : "0") + " burnout)") + (isActive(x.id) ? " · active" : "") + "</option>";
      }).join("") + "</optgroup>";
    }
    var ks = getSpell(ui.knownSel);
    var h = '<div class="duo"><div class="group pickbox"><h3>Known spells · ' + mine.length + "</h3>" +
      '<label class="field">Spell to cast<select id="knownSel">' + kOpts + "</select></label>" +
      withCol("k", function (sp) { return castHtml(sp, "k"); }) + "</div>";
    var expOpts = '<optgroup label="Common picks">' + EXP.map(function (e) { return '<option value="' + e.id + '"' + (e.id === state.exp ? " selected" : "") + ">" + e.name + " (" + ordinal(e.lvl) + ")</option>"; }).join("") + "</optgroup>";
    var presetNames = EXP.map(function (e) { return e.name.toLowerCase(); });
    for (var xl = 1; xl <= LP().expMax; xl++) {
      expOpts += '<optgroup label="Spell bank, ' + ordinal(xl) + ' level">' + BANK.filter(function (b) { return b.lvl === xl && presetNames.indexOf(b.name.toLowerCase()) < 0; }).map(function (b) {
        return '<option value="' + b.id + '"' + (b.id === state.exp ? " selected" : "") + ">" + esc(b.name) + (SCHOOLS[b.sch] ? " (" + SCHOOLS[b.sch] + ")" : "") + "</option>";
      }).join("") + "</optgroup>";
    }
    var ex = expSpell();
    h += '<div class="group pickbox"><h3>Experimental spell · +1 burnout</h3>' +
      '<label class="field">Today\'s pick<select id="expSel"' + (readOnly ? " disabled" : "") + '>' + expOpts + "</select></label>" +
      withCol("x", function (sp) { return castHtml(sp, "x"); }) + "</div>";
    var waCur = bankFind(ui.customName, ui.customLvl), waOpts = '<option value="">Choose a spell…</option>';
    for (var wl = 1; wl <= LP().maxSpell; wl++) {
      waOpts += '<optgroup label="' + ordinal(wl) + ' level">' + BANK.filter(function (b) { return b.lvl === wl; }).map(function (b) {
        return '<option value="' + b.id + '"' + (waCur && waCur.id === b.id ? " selected" : "") + ">" + esc(b.name) + (SCHOOLS[b.sch] ? " (" + SCHOOLS[b.sch] + ")" : "") + "</option>";
      }).join("") + "</optgroup>";
    }
    h += '<div class="group pickbox"><h3>Wild Arcana · 1 mythic power</h3>' +
      '<label class="field">Spell to cast<select id="waSel">' + waOpts + "</select></label>" +
      (waCur ? withCol("w", function (sp) { return castHtml(sp, "w"); }) : '<p class="hint">Any spell on her list, known or not. Choose one to see it here.</p>') +
      "</div></div>";
    $("pSpells").innerHTML =
      '<div class="ph"><h2>Spells</h2><span class="hint">Badge shows burnout before overdrive</span></div>' + h;
  }

     cache keeps the page usable without a connection and sends queued edits when it returns.
     Without config.js values the page runs as before: editable, saved in this browser only. */
  var CFG = window.TRACKER_CONFIG || {};
  var WANTS_EDIT = KEY + ":edit";
  var auth = null, ref = null, user = null, saveSeq = 0;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }

  function setStatus(t) { var el = $("status"); if (el) el.textContent = readOnly ? roLabel : t; }

  function setReadOnly(label) {
    readOnly = true;
    roLabel = label;
    document.body.classList.add("ro");
    ui.tray = false;
    setStatus("");
  }
  function setEditable(label) {
    readOnly = false;
    roLabel = "";
    document.body.classList.remove("ro");
    setStatus(label);
  }

  function scheduleSave() {
    dirty = true;
    setStatus("Saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 350);
  }
  function flush() {
    if (!dirty) return;
    dirty = false;
    var payload = JSON.stringify(state);
    lsSet(KEY, payload);
    if (!ref) { setStatus("Saved on this device"); return; }
    var mine = ++saveSeq;
    if (!navigator.onLine) setStatus("Offline, saved on this device");
    /* resolves only once the server has it; while offline Firestore queues it */
    ref.set({ json: payload, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
      .then(function () { if (mine === saveSeq && !dirty) setStatus("Saved"); })
      .catch(function (err) {
        if (err && err.code === "permission-denied") setReadOnly("Save refused by the Firestore rules for " + ((user && user.email) || "this account") + ". Publish firestore.rules with this UID: " + ((user && user.uid) || "?"));
        else setStatus("Not saved");
      });
  }

  function applyRemote(snap) {
    if (snap.metadata.hasPendingWrites || dirty) return; /* our own edit, not yet on the server */
    if (snap.exists) {
      try {
        var incoming = normalize(JSON.parse(snap.data().json || "{}"));
        lsSet(KEY, JSON.stringify(incoming));
        if (JSON.stringify(incoming) !== JSON.stringify(state)) { state = incoming; render(); }
      } catch (e) { /* keep what is shown */ }
    }
    var label = snap.metadata.fromCache ? "Offline, last saved copy" : "Live";
    if (readOnly) setReadOnly(snap.exists || snap.metadata.fromCache ? label : "Waiting for the first save");
    else setStatus(snap.metadata.fromCache ? "Offline, saved on this device" : "Saved");
  }

  function setUser(u) {
    user = u || null;
    if (user && [].concat(CFG.ownerUids || CFG.ownerUid || []).indexOf(user.uid) >= 0) setEditable(navigator.onLine ? "Saved" : "Offline, saved on this device");
    else setReadOnly(user ? "Signed in as " + (user.email || "?") + " (UID " + user.uid + "), view only" : navigator.onLine ? "Live" : "Offline, last saved copy");
    render();
    renderAcct();
  }

  /* sign-in link: shown to anyone who opened the page with ?edit or #edit once, or who is signed in */
  function renderAcct() {
    var b = $("acctBtn");
    if (!b) return;
    if (!auth) { b.hidden = true; return; }
    b.hidden = !user && !lsGet(WANTS_EDIT);
    b.textContent = user ? "Sign out" : "Sign in";
    $("pwBtn").hidden = !user || readOnly;
  }
  function hookAccount() {
    if (/[?&#]edit\b/.test(location.search + location.hash)) lsSet(WANTS_EDIT, "1");
    var sheet = $("signin"), err = $("siErr");
    /* shared editor account: ask only for the password */
    if (CFG.editorEmail) {
      $("siEmail").value = CFG.editorEmail;
      $("siEmailRow").hidden = true;
      $("siAs").hidden = false;
      $("siAsEmail").textContent = CFG.editorEmail;
      $("siOther").addEventListener("click", function () { $("siAs").hidden = true; $("siEmailRow").hidden = false; $("siEmail").value = ""; $("siEmail").focus(); });
    }
    function close() { sheet.hidden = true; err.textContent = ""; }
    $("acctBtn").addEventListener("click", function () {
      if (user) { auth.signOut(); return; }
      sheet.hidden = false;
      (CFG.editorEmail ? $("siPass") : $("siEmail")).focus();
    });
    $("siCancel").addEventListener("click", close);
    sheet.addEventListener("click", function (e) { if (e.target === sheet) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) close(); });
    /* change password: Firebase wants a recent sign-in, so confirm the current one first */
    var pw = $("pwSheet"), pwErr = $("pwErr");
    function closePw() { pw.hidden = true; pwErr.textContent = ""; $("pwForm").reset(); }
    $("pwBtn").addEventListener("click", function () {
      if (!user) return;
      $("pwUser").value = user.email || "";
      pw.hidden = false;
      $("pwOld").focus();
    });
    $("pwCancel").addEventListener("click", closePw);
    pw.addEventListener("click", function (e) { if (e.target === pw) closePw(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !pw.hidden) closePw(); });
    $("pwForm").addEventListener("submit", function (e) {
      e.preventDefault();
      pwErr.textContent = "";
      var nw = $("pwNew").value;
      if (nw !== $("pwNew2").value) { pwErr.textContent = "The new passwords don't match."; return; }
      if (nw.length < 6) { pwErr.textContent = "Use at least 6 characters."; return; }
      if (!navigator.onLine) { pwErr.textContent = "You need to be online to change the password."; return; }
      $("pwGo").disabled = true;
      var cred = firebase.auth.EmailAuthProvider.credential(user.email, $("pwOld").value);
      user.reauthenticateWithCredential(cred)
        .then(function () { return user.updatePassword(nw); })
        .then(function () { closePw(); setStatus("Password changed"); })
        .catch(function (x) {
          var c = (x && x.code) || "";
          pwErr.textContent = /invalid-credential|wrong-password/.test(c) ? "The current password is wrong."
            : /weak-password/.test(c) ? "That password is too weak. Use at least 6 characters."
            : /too-many-requests/.test(c) ? "Too many tries. Wait a few minutes and try again."
            : (x && x.message) || "Could not change the password.";
        })
        .then(function () { $("pwGo").disabled = false; });
    });

    /* forgot password: Firebase emails a reset link. With the template's action URL pointed at
       this page, the link opens the reset sheet below, and the code is spent only when she
       submits, so mail scanners that pre-open links can't use it up. */
    $("siForgot").addEventListener("click", function () {
      var email = CFG.editorEmail || $("siEmail").value.trim();
      if (!email) { err.textContent = "Enter the email first."; return; }
      err.textContent = "Sending…";
      auth.sendPasswordResetEmail(email, { url: location.origin + location.pathname + "?edit" })
        .then(function () { err.textContent = "Reset email requested for " + email + ". Open the newest one; the link works once."; })
        .catch(function (x) { err.textContent = ((x && x.message) || "Could not send the email.") + (x && x.code ? " [" + x.code + "]" : ""); });
    });

    var rs = $("rsSheet"), rsErr = $("rsErr");
    var q = new URLSearchParams(location.search), rsCode = q.get("mode") === "resetPassword" ? q.get("oobCode") : null;
    function closeRs() {
      rs.hidden = true; rsErr.textContent = ""; $("rsForm").reset();
      history.replaceState(null, "", location.pathname + "?edit"); /* drop the spent code from the address */
    }
    if (rsCode) {
      lsSet(WANTS_EDIT, "1");
      rs.hidden = false;
      auth.verifyPasswordResetCode(rsCode)
        .then(function (email) { $("rsUser").value = email; $("rsFor").textContent = "For " + email; $("rsNew").focus(); })
        .catch(function () { rsErr.textContent = "This reset link has expired or was already used. Tap Sign in, then Forgot password? to get a new one."; $("rsGo").disabled = true; });
    }
    $("rsCancel").addEventListener("click", closeRs);
    $("rsForm").addEventListener("submit", function (e) {
      e.preventDefault();
      rsErr.textContent = "";
      var nw = $("rsNew").value;
      if (nw !== $("rsNew2").value) { rsErr.textContent = "The passwords don't match."; return; }
      if (nw.length < 6) { rsErr.textContent = "Use at least 6 characters."; return; }
      $("rsGo").disabled = true;
      auth.confirmPasswordReset(rsCode, nw)
        .then(function () { return auth.signInWithEmailAndPassword($("rsUser").value, nw); })
        .then(function () { closeRs(); setStatus("Password changed"); })
        .catch(function (x) {
          var c = (x && x.code) || "";
          rsErr.textContent = /expired|invalid-action-code/.test(c) ? "This reset link has expired or was already used. Request a new one."
            : /weak-password/.test(c) ? "That password is too weak. Use at least 6 characters."
            : (x && x.message) || "Could not set the password.";
          $("rsGo").disabled = false;
        });
    });

    $("signinForm").addEventListener("submit", function (e) {
      e.preventDefault();
      err.textContent = "";
      $("siGo").disabled = true;
      auth.signInWithEmailAndPassword($("siEmail").value.trim(), $("siPass").value)
        .then(function () { $("siPass").value = ""; close(); })
        .catch(function (x) {
          var c = (x && x.code) || "";
          var msg = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "Wrong email or password, or no account with that email."
            : /too-many-requests/.test(c) ? "Too many tries. Wait a few minutes, or reset the password."
            : /network-request-failed/.test(c) ? "Can't reach Firebase. Check the connection."
            : (x && x.message) || "Could not sign in.";
          err.textContent = msg + (c ? " [" + c + "]" : "");
        })
        .then(function () { $("siGo").disabled = false; });
    });
  }

  function initStore() {
    var cached = lsGet(KEY);
    if (cached) { try { state = normalize(JSON.parse(cached)); render(); } catch (e) { /* ignore a bad copy */ } }
    var fb = CFG.firebase || {};
    if (!fb.apiKey || !fb.projectId || !CFG.characterId || !window.firebase) {
      setStatus("This device only");
      return;
    }
    firebase.initializeApp(fb);
    var store = firebase.firestore();
    store.enablePersistence({ synchronizeTabs: true }).catch(function () { /* private window or old browser: online only */ });
    auth = firebase.auth();
    ref = store.collection("trackers").doc(CFG.characterId);
    setReadOnly("Loading");
    hookAccount();
    renderAcct();
    auth.onAuthStateChanged(setUser);
    ref.onSnapshot({ includeMetadataChanges: true }, applyRemote, function () { setStatus("Can't reach the tracker"); });
    window.addEventListener("online", function () { setUser(user); });
    window.addEventListener("offline", function () { if (readOnly) setReadOnly("Offline, last saved copy"); else setStatus("Offline, saved on this device"); });
  }

  renderRules();
  render();
  (function () {
    var v = viewFromHash();
    if (!v) { try { v = localStorage.getItem(VIEW_KEY); } catch (e) {} }
    setView(v, true);
  })();
  initStore();
  setTimeout(function () { loadCodex().catch(function () {}); }, 1500);
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline install unavailable */ });
  }
})();
</script>

</body>
</html>
